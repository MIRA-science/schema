id: http://rdfs.org/sioc/ns#
name: SIOC
prefixes:
  foaf: http://xmlns.com/foaf/0.1/
  sioc: http://rdfs.org/sioc/ns#

# This is deliberately a subset

default_prefix: sioc
imports:
  - dct
emit_prefixes:
  - sioc
  - dct

classes:
  Container:
    class_uri: sioc:Container
  Item:
    class_uri: sioc:Item
    slots:
      - format
      - content
      - has_container
      - creator
  FoafAgent:
    abstract: true
    class_uri: foaf:Agent
  UserAccount:
    class_uri: sioc:UserAccount
    slots:
      - accountName

slots:
  has_container:
    slot_uri: sioc:has_container
    domain: Item
    range: Container
    inlined: false
    inverse: container_of
  container_of:
    slot_uri: sioc:container_of
    domain: Container
    range: Item
    multivalued: true
    inverse: has_container
  content:
    slot_uri: sioc:content
    range: string
    inlined: true
  accountName:
    slot_uri: foaf:accountName
    domain: UserAccount
    range: string
  name:
    slot_uri: foaf:name
    domain: FoafAgent
    range: string
  creator:
    slot_uri: dct:creator
    range: UserAccount
    multivalued: true
  account:
    slot_uri: foaf:account
    domain: FoafAgent
    range: UserAccount
    multivalued: true
