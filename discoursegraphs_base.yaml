id: https://discoursegraphs.com/schema/dg_base
name: discoursegraphs_base
prefixes:
  linkml: https://w3id.org/linkml/
  dgb: https://discoursegraphs.com/schema/dg_base#
  po: http://www.essepuntato.it/2008/12/pattern#

default_prefix: dgb
imports:
  - sioc
  - rdf

classes:
  Any:
    class_uri: linkml:Any

  NodeSchema:
    description: Abstract class for node definitions
    class_uri: dgb:NodeSchema
    abstract: true
    mixin: true
    is_a: Item
    slots:
      - created
      - modified
      - creator
      - title
      - description
      - has_container

  AbstractRelationDef:
    description: Abstract meta-class for relation definitions
    is_a: NodeSchema
    class_uri: dgb:AbstractRelationDef
    abstract: true
    mixin: true

  RelationDef:
    description: Abstract class for relation definitions
    class_uri: dgb:RelationDef
    abstract: true
    mixin: true
    slots:
      - domain
      - range
    mixins:
      - AbstractRelationDef

  RelationInstance:
    description: Abstract class for relation instances
    class_uri: dgb:RelationInstance
    abstract: true
    mixin: true
    mixins:
      - Statement
      - NodeSchema
    slots:
      - source
      - destination

  Agent:
    class_uri: dgb:Agent
    is_a: FoafAgent
    # rdfs:subClassOf prov:Agent, foaf:Agent;
    description: An agent engaging in an activity, and posting nodes.
    slots:
      - name
      - account

slots:
  RelationDef:
    slot_uri: dgb:RelationDef
  domain:
    slot_uri: rdfs:domain
    description: A domain of the subject property.
    domain: RelationDef
    range: NodeSchema
  range:
    slot_uri: rdfs:range
    description: A range of the subject property.
    domain: RelationDef
    range: NodeSchema
  description:
    slot_uri: dct:description
    description: "Description may include but is not limited to: an abstract, a table of contents, a graphical representation, or a free-text account of the resource."
    domain: NodeSchema
    range: Item
  source:
    slot_uri: dgb:source
    subproperty_of: rdf_subject
    domain: RelationInstance
    range: NodeSchema
    description: "The source of a binary relation"
  destination:
    slot_uri: dgb:destination
    subproperty_of: rdf_object
    domain: RelationInstance
    range: NodeSchema
    description: "The destination of a binary relation"

  textRefersToNode:
    slot_uri: dgb:textRefersToNode
    description: A text resource refers to a node
    domain: Item
    range: NodeSchema

  contains:
    description: A part of a document is contained in another part or whole document
    slot_uri: po:contains
    domain: Item
    range: Item

  isContainedBy:
    slot_uri: po:isContainedBy
    description: An element that is contained by another structured element.
    inverse: contains
    domain: Item
    range: Item
