id: https://discoursegraphs.com/schema/dg_base
name: discoursegraphs_base
prefixes:
  linkml: https://w3id.org/linkml/
  dgb: https://discoursegraphs.com/schema/dg_base#
  po: http://www.essepuntato.it/2008/12/pattern#

default_prefix: dgb
imports:
  - sioc

classes:
  Any:
    class_uri: linkml:Any

  NodeSchema:
    class_uri: dgb:NodeSchema
    abstract: true
    mixin: true
    is_a: Item
    slots:
      - created
      - modified
      - creator
      - title
      - description
      - has_container

  AbstractRelationDef:
    is_a: NodeSchema
    class_uri: dgb:AbstractRelationDef
    abstract: true
    mixin: true

  RelationDef:
    class_uri: dgb:RelationDef
    abstract: true
    mixin: true
    slots:
      - domain
      - range
    mixins:
      - AbstractRelationDef

  Agent:
    class_uri: dgb:Agent
    is_a: FoafAgent
    # rdfs:subClassOf prov:Agent, foaf:Agent;
    description: An agent engaging in an activity, and posting MIRA nodes.
    slots:
      - name
      - account

slots:
  RelationDef:
    slot_uri: dgb:RelationDef
  domain:
    slot_uri: rdfs:domain
    domain: RelationDef
    range: NodeSchema
  range:
    slot_uri: rdfs:range
    domain: RelationDef
    range: NodeSchema
  description:
    slot_uri: dct:description
    domain: NodeSchema
    range: Item

  textRefersToNode:
    slot_uri: dgb:textRefersToNode
    domain: Item
    range: NodeSchema

  contains:
    description: A part of a document is contained in another part or whole document
    slot_uri: po:contains
    domain: Item
    range: Item

  isContainedBy:
    slot_uri: po:isContainedBy
    inverse: contains
    domain: Item
    range: Item
