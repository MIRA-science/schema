id: http://www.w3.org/ns/prov#
name: Provenance
prefixes:
  prov: http://www.w3.org/ns/prov#

# This is deliberately a subset

default_prefix: prov
classes:
  Activity:
    class_uri: prov:Activity
    abstract: true
    description: "An activity is something that occurs over a period of time and acts upon or with entities; it may include consuming, processing, transforming, modifying, relocating, using, or generating entities."
  Entity:
    class_uri: prov:Entity
    description: "An entity is a physical, digital, conceptual, or other kind of thing with some fixed aspects; entities may be real or imaginary."
slots:
  generated:
    slot_uri: prov:generated
    domain: Activity
    range: Entity
    inlined: false
    inverse: wasGeneratedBy
  wasGeneratedBy:
    slot_uri: prov:wasGeneratedBy
    domain: Entity
    range: Activity
    inlined: false
  used:
    slot_uri: prov:used
    description: "A prov:Entity that was used by this prov:Activity. For example, :baking prov:used :spoon, :egg, :oven ."
    domain: Activity
    range: Entity
    inlined: false
    inverse: wasUsedBy
  wasUsedBy:
    slot_uri: prov:wasUsedBy
    domain: Entity
    range: Activity
    inlined: false
    inverse: used
