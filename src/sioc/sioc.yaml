id: http://rdfs.org/sioc/ns#
name: SIOC
prefixes:
  sioc: http://rdfs.org/sioc/ns#

# This is deliberately a subset

default_prefix: sioc
imports:
  - ../dc/dc
emit_prefixes:
  - sioc
  - dc

classes:
  Container:
    class_uri: sioc:Container
  Item:
    class_uri: sioc:Item
    slots:
      - format
      - content
      - has_container

slots:
  has_container:
    slot_uri: sioc:has_container
    domain: Item
    range: Container
    inlined: false
    inverse: container_of
  container_of:
    slot_uri: sioc:container_of
    domain: Container
    range: Item
    multivalued: true
    inverse: has_container
  content:
    slot_uri: sioc:content
    range: string
    inlined: true
