id: http://purl.org/dc/terms/
name: DublinCoreElements
prefixes:
  linkml: https://w3id.org/linkml/
  dc: http://purl.org/dc/terms/
  dct: http://purl.org/dc/terms/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: dct
emit_prefixes:
  - dct
default_range: string

# This is deliberately a subset

types:
  string:
    uri: xsd:string
    base: str
  datetime:
    uri: xsd:dateTime
    base: str

slots:
  created:
    slot_uri: dct:created
    range: datetime
  modified:
    slot_uri: dct:modified
    range: datetime

  title:
    slot_uri: dct:title
  format:
    slot_uri: dct:format
  subject:
    slot_uri: dct:subject
