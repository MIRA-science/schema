id: http://purl.org/dc/elements/1.1/
name: DublinCoreElements
prefixes:
  linkml: https://w3id.org/linkml/
  dc: http://purl.org/dc/elements/1.1/
  dct: http://purl.org/dc/terms/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: dc
emit_prefixes:
  - dc
default_range: string

# This is deliberately a subset

types:
  string:
    uri: xsd:string
    base: str
  datetime:
    uri: xsd:dateTime
    base: str

slots:
  created:
    slot_uri: dc:created
    range: datetime
  modified:
    slot_uri: dc:modified
    range: datetime

  title:
    slot_uri: dc:title
  format:
    slot_uri: dc:format
  description:
    slot_uri: dc:description
  creator:
    slot_uri: dc:creator
  subject:
    slot_uri: dc:subject
